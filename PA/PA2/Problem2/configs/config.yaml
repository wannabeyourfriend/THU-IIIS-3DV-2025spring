# 基础配置
seed: 42
image_size: 224

# 归一化参数
normalize:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# 数据配置
data:
  root_dir: "E:/GITHUB/3DV/PA/PA2/Problem2/data"  # 使用绝对路径
  clean: true  # 使用干净的点云数据

# 模型配置
model:
  num_points: 1024
  feature_dim: 512

# 训练配置
train:
  batch_size: 16
  num_workers: 4
  epochs: 50
  lr: 0.001
  lr_step: 10
  lr_gamma: 0.5
  use_cd: true  # 是否使用Chamfer Distance训练
  use_hd: true  # 是否使用Hausdorff Distance训练


# 可视化配置
visualization:
  model_path: "outputs/2025-04-25/11-13-55/model_cd/best_model.pth"  # 模型路径
  num_samples: 10  # 要可视化的样本数量