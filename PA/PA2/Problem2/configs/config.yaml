# Basic configurations
seed: 42
image_size: 224

# Normalization parameters
normalize:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# Data configurations
data:
  root_dir: "/root/autodl-tmp/Problem2/data"  # Use absolute path
  clean: true  # Use clean point cloud data

# Model configurations
model:
  num_points: 1024
  feature_dim: 512

# Training configurations
train:
  batch_size: 16
  num_workers: 4
  epochs: 100
  lr: 0.001
  lr_step: 10
  lr_gamma: 0.5
  use_cd: true  # Whether to use Chamfer Distance for training
  use_hd: true  # Whether to use Hausdorff Distance for training

# Visualization configurations
visualization:
  model_path: "/root/autodl-tmp/Problem2/outputs/2025-04-26/20-38-14/model_cd/best_model.pth"  # Model path
  num_samples: 10  # Number of samples to visualize
  realistic: true  # Use realistic rendering by default
  sphere_radius: 0.08  # Sphere radius for realistic rendering